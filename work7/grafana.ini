[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3000
domain = 192.168.20.11
root_url = http://192.168.20.11:3000/

[database]
type = sqlite3
path = grafana.db

[security]
admin_user = admin
disable_gravatar = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
mode = console file
level = info

[smtp]
enabled = true
host = smtp.gmail.com:587
user = sasipisos082@gmail.com
from_address = sasipisos082@gmail.com
from_name = Grafana Office
startTLS_policy = MandatoryStartTLS
